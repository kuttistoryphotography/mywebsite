<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background — matches app's dark theme -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>
  <!-- Gold accent ring — brand colour -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#d4a843" stroke-width="1.5"/>
  <!-- White inner circle — matches header logo: bg-white circle -->
  <circle cx="32" cy="32" r="22" fill="#ffffff"/>
  <!-- K monogram in dark — matches header logo: text-black font-bold -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="700"
    fill="#0a0a0a"
  >K</text>
</svg>
